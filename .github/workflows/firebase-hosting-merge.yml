name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - questly
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build questly app
        working-directory: templates/questly
        run: pnpm build
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUESTS4FRIENDS }}
          channelId: live
          projectId: quests4friends
          firebaseToolsVersion: latest
          workingDirectory: templates/questly